name: Custom Build

# 二开镜像流水线:
# - push custom     -> 直接构建推送 GHCR
# - 每日定时/手动    -> 检查上游新 release,merge 进 custom 后构建;无新版则跳过
#                      (合并时保留二开自己的 .github/workflows/,详见 sync 步骤注释)
# 冲突时本流程失败,需本地解决:git fetch upstream --tags && git merge <tag>
on:
  push:
    branches: [custom]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '23 2 * * *' # 每日 UTC 02:23(北京 10:23)
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force image build even without upstream change'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: custom-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Sync latest upstream release into custom
        id: sync
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          git config user.name "dawanglaohu"
          git config user.email "dawanglaohu@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream 'refs/tags/v*:refs/tags/v*' --no-tags
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "Latest upstream release tag: ${LATEST}"
          if git merge-base --is-ancestor "${LATEST}" HEAD; then
            echo "custom already contains ${LATEST}, nothing to sync"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            BEFORE=$(git rev-parse HEAD)
            if ! git merge --no-commit --no-ff "${LATEST}"; then
              echo "::error::合并 ${LATEST} 到 custom 冲突。本地处理:git fetch upstream --tags && git checkout custom && git merge ${LATEST},解决冲突后 push。"
              exit 1
            fi
            # GITHUB_TOKEN 无权推送触碰 .github/workflows/ 的提交(GitHub 硬限制,
            # permissions 里也没有可开的 workflows 项),上游一改 CI 文件这步就会
            # remote rejected。二开分支自带 CI 配置,故合并时保留 custom 侧
            # workflows,丢弃上游对该目录的改动与新增。
            git checkout "${BEFORE}" -- .github/workflows/
            git diff --cached -z --name-only --diff-filter=A -- .github/workflows/ \
              | xargs -0 -r git rm -f -q --
            git commit --no-edit
            # 同理不推上游 tag:其指向的上游提交同样含 workflows 改动,会被一并拒绝。
            # 版本号由 Decide build 从本地 fetch 下来的 tag 解析,不依赖远端存在该 tag。
            git push origin custom
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide build
        id: decide
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          BUILD=true
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ steps.sync.outputs.merged }}" != "true" ] && [ "${FORCE_BUILD}" != "true" ]; then
            BUILD=false
          fi
          # 版本号:优先取 HEAD 可达的最新 v* tag(上游发版先打 tag 后补 VERSION 文件,
          # 文件会滞后一个版本),取不到再兜底读 VERSION 文件
          VERSION=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          [ -n "${VERSION}" ] || VERSION=$(tr -d ' \n' < backend/cmd/server/VERSION)
          SHA8=$(git rev-parse --short=8 HEAD)
          {
            echo "build=${BUILD}"
            echo "version=${VERSION}"
            echo "sha8=${SHA8}"
          } >> "$GITHUB_OUTPUT"
          echo "build=${BUILD} version=${VERSION} sha8=${SHA8}"

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.decide.outputs.version }}
            COMMIT=custom-${{ steps.decide.outputs.sha8 }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          tags: |
            ghcr.io/dawanglaohu/sub2api:custom-${{ steps.decide.outputs.sha8 }}
            ghcr.io/dawanglaohu/sub2api:v${{ steps.decide.outputs.version }}-custom
            ghcr.io/dawanglaohu/sub2api:custom-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "## Custom Build"
            echo "- event: ${{ github.event_name }}"
            echo "- merged upstream: ${{ steps.sync.outputs.merged || 'n/a' }}"
            echo "- build: ${{ steps.decide.outputs.build }}"
            if [ "${{ steps.decide.outputs.build }}" = "true" ]; then
              echo "- 生产用不可变标签: \`ghcr.io/dawanglaohu/sub2api:custom-${{ steps.decide.outputs.sha8 }}\`"
              echo "- 版本标签: \`v${{ steps.decide.outputs.version }}-custom\` / 移动标签: \`custom-latest\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
